<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f1729"/>
      <stop offset="100%" stop-color="#1a2744"/>
    </linearGradient>
    <linearGradient id="layer1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#60a5fa"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="layer2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0ea5e9"/>
    </linearGradient>
    <linearGradient id="layer3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#14b8a6"/>
    </linearGradient>
    <linearGradient id="layer4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Foundation layers - centered vertically, bottom to top, wider to narrower -->
  <!-- Layer 1: Foundation (VPC/Network) - widest -->
  <rect x="96" y="336" width="320" height="48" rx="8" fill="url(#layer3)" opacity="0.95"/>

  <!-- Layer 2: Compute (ECS/ALB) -->
  <rect x="126" y="268" width="260" height="48" rx="8" fill="url(#layer2)" opacity="0.95"/>

  <!-- Layer 3: Access (SSO/Bastion) -->
  <rect x="156" y="200" width="200" height="48" rx="8" fill="url(#layer1)" opacity="0.95"/>

  <!-- Layer 4: CI/CD - narrowest -->
  <rect x="186" y="132" width="140" height="48" rx="8" fill="url(#layer4)" opacity="0.95"/>

  <!-- Upward chevron above the stack -->
  <polyline points="222,104 256,68 290,104" fill="none" stroke="#e2e8f0" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>

  <!-- Subtle grid dots on layers for "infrastructure" feel -->
  <g fill="#ffffff" opacity="0.2">
    <!-- Layer 1 dots -->
    <circle cx="140" cy="360" r="3"/><circle cx="168" cy="360" r="3"/><circle cx="196" cy="360" r="3"/>
    <circle cx="316" cy="360" r="3"/><circle cx="344" cy="360" r="3"/><circle cx="372" cy="360" r="3"/>
    <!-- Layer 2 dots -->
    <circle cx="166" cy="292" r="3"/><circle cx="194" cy="292" r="3"/>
    <circle cx="318" cy="292" r="3"/><circle cx="346" cy="292" r="3"/>
    <!-- Layer 3 dots -->
    <circle cx="192" cy="224" r="3"/>
    <circle cx="320" cy="224" r="3"/>
    <!-- Layer 4 dots -->
    <circle cx="218" cy="156" r="3"/>
    <circle cx="294" cy="156" r="3"/>
  </g>

  <!-- Text -->
  <text x="256" y="448" text-anchor="middle" font-family="sans-serif" font-size="36" font-weight="600" fill="#94a3b8" letter-spacing="8">FOUNDATION</text>
</svg>
